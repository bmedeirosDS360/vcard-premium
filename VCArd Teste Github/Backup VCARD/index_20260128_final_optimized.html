    const Carousel = ({ images }) => {
      const [index, setIndex] = useState(0);
      const nextImage = (e) => { e?.stopPropagation(); setIndex((prev) => (prev + 1) % images.length); };
      const prevImage = (e) => { e?.stopPropagation(); setIndex((prev) => (prev - 1 + images.length) % images.length); };
      return (
        <div className="relative w-full mb-8 group">

              <motion.div key={index} initial={{ opacity: 0, x: 100 }} animate={{ opacity: 1, x: 0 }} exit={{ opacity: 0, x: -100 }} transition={{ type: "spring", stiffness: 300, damping: 30 }} className="absolute inset-0 z-10" drag="x" dragConstraints={{ left: 0, right: 0 }} dragElastic={0.2} onDragEnd={(e, { offset }) => { if (offset.x < -50) nextImage(); else if (offset.x > 50) prevImage(); }}>

                <button onClick={nextImage} className="absolute right-2 top-1/2 -translate-y-1/2 z-30 p-2 text-white/70 hover:text-ds-gold bg-black/30 hover:bg-black/60 backdrop-blur-sm rounded-full border border-white/10 transition-all opacity-0 group-hover:opacity-100 disabled:opacity-0"><Icons.ChevronRight size={24} /></button>

        </div>
      );

    const VideoPlayer = ({ url }) => {
      if (!url) return null;
      const videoRef = useRef(null);
      const [playing, setPlaying] = useState(false);
      const [muted, setMuted] = useState(false);
      const isDrive = url.includes('drive.google.com');
      const isDirectFile = url.match(/\.(mp4|webm|ogg|avi|mov)$/i);

      const togglePlay = (e) => {
        e.stopPropagation();
        if (videoRef.current) {
          if (playing) videoRef.current.pause();
          else videoRef.current.play();
          setPlaying(!playing);
        }
      };

      const toggleMute = (e) => {
        e.stopPropagation();
        if (videoRef.current) {
          videoRef.current.muted = !muted;
          setMuted(!muted);
        }
      };

      const toggleFullscreen = (e) => {
        e.stopPropagation();
        if (videoRef.current) {
          if (videoRef.current.requestFullscreen) {
            videoRef.current.requestFullscreen();
          } else if (videoRef.current.webkitRequestFullscreen) { /* Safari */
            videoRef.current.webkitRequestFullscreen();
          } else if (videoRef.current.msRequestFullscreen) { /* IE11 */
            videoRef.current.msRequestFullscreen();
          }
        }
      };

      return (
        <div className="mb-8">
          <motion.div initial={{ opacity: 0, y: 20 }} animate={{ opacity: 1, y: 0 }} className="w-full aspect-video rounded-2xl overflow-hidden shadow-2xl border border-ds-gold/20 bg-black/50 relative group">

              <iframe src={getVideoEmbedUrl(url)} className="w-full h-full" allowFullScreen></iframe>

              <div className="relative w-full h-full cursor-pointer bg-black" onClick={togglePlay}>

                {/* Overlay Controls */}
                <div className={`absolute inset-0 bg-black/20 transition-opacity duration-300 flex items-center justify-center ${playing ? 'opacity-0 hover:opacity-100' : 'opacity-100'}`}>

                    {playing ? <Icons.Pause size={32} fill="currentColor" /> : <Icons.Play size={32} fill="currentColor" className="ml-1" />}
                  </button>
                </div>

                {/* Control Bar */}
                <div className="absolute bottom-4 right-4 flex gap-3 z-20">
                  <button onClick={toggleMute} type="button" className="p-3 rounded-full bg-black/40 text-white hover:bg-ds-gold hover:text-ds-green transition-all backdrop-blur-md border border-white/10 cursor-pointer">
                    {muted ? <Icons.VolumeX size={20} /> : <Icons.Volume2 size={20} />}
                  </button>
                  <button onClick={toggleFullscreen} type="button" className="p-3 rounded-full bg-black/40 text-white hover:bg-ds-gold hover:text-ds-green transition-all backdrop-blur-md border border-white/10 cursor-pointer">
                    <Icons.Maximize size={20} />
                  </button>
                </div>
              </div>
            )}
          </motion.div>
        </div>
      );

            <button onClick={onClose} className="absolute top-4 right-4 p-2 text-white/50 hover:text-white bg-black/20 rounded-full"><Icons.X size={20} /></button>

      const [formData, setFormData] = useState(data);

      const [password, setPassword] = useState('');
      const [error, setError] = useState(false);

        const { name, value } = e.target;
        if (name.includes('.')) {
          const [parent, child] = name.split('.');
          setFormData(prev => ({ ...prev, [parent]: { ...prev[parent], [child]: value } }));
        } else {
          setFormData(prev => ({ ...prev, [name]: value }));
        }

      const handleCarouselChange = (index, value) => {
        const newCarousel = [...formData.carousel];
        newCarousel[index] = value;

                  <div>
                    <label className="block text-xs text-ds-gold uppercase font-bold mb-1">Vídeo (URL) <span className="text-white/40 text-[9px] normal-case ml-1">(YouTube / Google Drive)</span></label>
                    <input name="videoUrl" value={formData.videoUrl} onChange={handleChange} className="w-full bg-white/5 border border-white/10 rounded p-2 text-white text-xs font-mono" placeholder="Ex: drive.google.com/file/..." />
                  </div>
                  <div>
                    <label className="block text-xs text-ds-gold uppercase font-bold mb-1">Galeria (Destaques) <span className="text-white/40 text-[9px] normal-case ml-1">(Imagens do Drive)</span></label>
                    <div className="space-y-2">
                      {formData.carousel.map((url, i) => (
                        <div key={i} className="flex gap-2 items-center">
                          <span className="text-[10px] text-white/50 w-4">{i + 1}</span>
                          <input value={url} onChange={(e) => handleCarouselChange(i, e.target.value)} className="flex-1 bg-white/5 border border-white/10 rounded p-2 text-white text-xs font-mono" placeholder="Link da imagem..." />
                          <button onClick={() => removeCarouselItem(i)} className="bg-red-500/20 text-red-500 p-2 rounded hover:bg-red-500 hover:text-white"><Icons.X size={14} /></button>
                        </div>
                      ))}
                      <button onClick={addCarouselItem} className="w-full py-2 border border-dashed border-white/20 text-xs text-white/50 hover:text-ds-gold hover:border-ds-gold rounded transition-colors">+ Adicionar Foto à Galeria</button>
                    </div>
                  </div>
                </div>
              )}

              {activeTab === 'social' && (
                <div className="space-y-4">
                  <div>
                    <label className="block text-xs text-ds-gold uppercase font-bold mb-1 flex items-center gap-2"><Icons.Facebook size={14} /> Facebook</label>
                    <input name="social.facebook" value={formData.social?.facebook || ''} onChange={handleChange} className="w-full bg-white/5 border border-white/10 rounded p-2 text-white text-xs font-mono" />
                  </div>
                  <div>
                    <label className="block text-xs text-ds-gold uppercase font-bold mb-1 flex items-center gap-2"><Icons.Instagram size={14} /> Instagram</label>
                    <input name="social.instagram" value={formData.social?.instagram || ''} onChange={handleChange} className="w-full bg-white/5 border border-white/10 rounded p-2 text-white text-xs font-mono" />
                  </div>
                  <div>
                    <label className="block text-xs text-ds-gold uppercase font-bold mb-1 flex items-center gap-2"><Icons.Linkedin size={14} /> Linkedin</label>
                    <input name="social.linkedin" value={formData.social?.linkedin || ''} onChange={handleChange} className="w-full bg-white/5 border border-white/10 rounded p-2 text-white text-xs font-mono" />
                  </div>
                  <div>
                    <label className="block text-xs text-ds-gold uppercase font-bold mb-1 flex items-center gap-2"><Icons.Home size={14} /> Website / Outro</label>
                    <input name="website" value={formData.website} onChange={handleChange} className="w-full bg-white/5 border border-white/10 rounded p-2 text-white text-xs font-mono" />
                  </div>
                </div>
              )}

              {activeTab === 'legal' && (
                <div className="space-y-4">
                  <div>
                    <label className="block text-xs text-ds-gold uppercase font-bold mb-1">Título Sobre Mim</label>
                    <input name="aboutTitle" value={formData.aboutTitle} onChange={handleChange} className="w-full bg-white/5 border border-white/10 rounded p-2 text-white text-sm" />
                  </div>
                  <div>
                    <label className="block text-xs text-ds-gold uppercase font-bold mb-1">Texto Sobre Mim</label>
                    <textarea name="aboutText" value={formData.aboutText} onChange={handleChange} rows="6" className="w-full bg-white/5 border border-white/10 rounded p-2 text-white text-xs leading-relaxed" />
                  </div>
                  <div>
                    <label className="block text-xs text-ds-gold uppercase font-bold mb-1">Política de Privacidade</label>
                    <textarea name="privacyText" value={formData.privacyText} onChange={handleChange} rows="4" className="w-full bg-white/5 border border-white/10 rounded p-2 text-white text-xs leading-relaxed" />
                  </div>
                  <div>
                    <label className="block text-xs text-ds-gold uppercase font-bold mb-1">Aviso Legal</label>
                    <textarea name="legalText" value={formData.legalText} onChange={handleChange} rows="4" className="w-full bg-white/5 border border-white/10 rounded p-2 text-white text-xs leading-relaxed" />
                  </div>
                </div>
              )}

            </div>

            {/* Footer */}
            <div className="p-4 border-t border-white/10 bg-black/40">
              <button onClick={() => onSave(formData)} className="w-full bg-ds-gold text-ds-green font-bold py-3 rounded-xl flex items-center justify-center gap-2 hover:bg-white transition-colors shadow-lg shadow-ds-gold/10 active:scale-95">
                <Icons.Save size={18} /> Salvar Alterações
              </button>
            </div>

          </motion.div>
        </div>
      );
    };

    // ==========================================
    // 3. MAIN APP LOGIC
    // ==========================================

    // --- APP (Replica of src/App.tsx) ---
    function App() {
      const [data, setData] = useState(() => {
        // AUTO-RESTORE LOGIC (Hidden in src but essential for restoration)
        const saved = localStorage.getItem('cardConfig') || localStorage.getItem('cardData');
        return saved ? { ...DEFAULT_DATA, ...JSON.parse(saved) } : DEFAULT_DATA;
      });
      const [showQR, setShowQR] = useState(false);
      const [showServices, setShowServices] = useState(false);
      const [showAbout, setShowAbout] = useState(false);
      const [showPrivacy, setShowPrivacy] = useState(false);
      const [showLegal, setShowLegal] = useState(false);
      const [showAdmin, setShowAdmin] = useState(false); // Manually added for rescue

      const generateVCard = () => {
        const vCardData = `BEGIN:VCARD\nVERSION:3.0\nN:${data.name};;;;\nFN:${data.name} | DS Alverca\nORG:${data.agency}\nTITLE:${data.role}\nTEL;TYPE=CELL:${data.phone}\nEMAIL:${data.email}\nURL:${data.website}\nEND:VCARD`;
        const blob = new Blob([vCardData], { type: 'text/vcard' });
        const url = window.URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url;
        link.setAttribute('download', `${data.name.replace(' ', '_')}.vcf`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      };

      const shareContact = async () => {
        if (navigator.share) {
          try { await navigator.share({ title: data.name, text: `Contacte ${data.name}`, url: window.location.href }); } catch (err) { }
        } else {
          try { await navigator.clipboard.writeText(window.location.href); alert('Link copiado!'); } catch (e) { alert('Copie o link do navegador.'); }
        }
      };

      const openWhatsApp = () => { window.open(`https://wa.me/${data.whatsapp}`, '_blank'); };

      return (
        <div className="min-h-[100dvh] relative font-sans text-white overflow-x-hidden pb-32">
          <div className="fixed top-[-20%] left-[-20%] w-[140%] h-[80%] bg-[radial-gradient(circle,rgba(197,160,89,0.08)_0%,rgba(0,59,43,0)_70%)] pointer-events-none z-0"></div>

          <header className="pt-8 pb-4 px-6 text-center relative z-10 w-full overflow-hidden">
            <motion.div initial={{ opacity: 0, y: -20 }} animate={{ opacity: 1, y: 0 }} transition={{ duration: 0.8 }} className="mb-8 mt-4">
              <img src={getDirectImageUrl(data.logoUrl)} className="h-24 mx-auto object-contain drop-shadow-gold filter brightness-110" />
            </motion.div>
            <motion.div initial={{ opacity: 0, scaleY: 0 }} animate={{ opacity: 1, scaleY: 1 }} transition={{ duration: 0.6 }} className="w-full max-w-md mx-auto h-48 mb-8 rounded-2xl overflow-hidden bg-[#004137] border border-ds-gold/30 relative shadow-[0_0_25px_rgba(197,160,89,0.4)]">
              <img src={getDirectImageUrl(data.coverUrl)} className="w-full h-full object-cover" />
            </motion.div>
            <div className="relative w-36 h-36 mx-auto mt-6">
              <motion.div initial={{ scale: 0.8, opacity: 0 }} animate={{ scale: 1, opacity: 1 }} className="relative w-full h-full">
                <div className="absolute inset-0 rounded-full animate-pulse-gold bg-[#004137] -z-10"></div>
                <img src={getDirectImageUrl(data.avatarUrl)} className="w-full h-full object-cover rounded-full border-[3px] border-ds-gold shadow-[0_0_35px_rgba(197,160,89,0.5)] bg-[#004137]" />
              </motion.div>
            </div>
            <motion.div initial={{ opacity: 0, y: 10 }} animate={{ opacity: 1, y: 0 }} className="mt-4">
              <h2 className="text-3xl font-serif font-bold mb-1 text-white drop-shadow-md">{data.name}</h2>
              <div className="h-0.5 w-12 bg-ds-gold mx-auto my-3 shadow-[0_0_10px_rgba(197,160,89,0.8)]"></div>
              <p className="text-ds-gold text-sm uppercase tracking-widest font-semibold drop-shadow-sm">{data.role}</p>
              <p className="text-white text-xs mt-2 italic font-light tracking-wide">{data.tagline}</p>
              <p className="text-white text-[10px] mt-4 tracking-wider">{data.agency}</p>
            </motion.div>
          </header>

          <main className="px-5 space-y-6 max-w-md mx-auto relative z-10">
            <div className="flex justify-center items-center gap-4 py-2">
              <ContactIconBtn icon={Icons.Phone} onClick={() => window.open(`tel:${data.phone}`)} label={<>Ligar<br />para Mim</>} />
              <ContactIconBtn icon={Icons.UserPlus} onClick={generateVCard} label="Guardar Contato" />
              <ContactIconBtn icon={Icons.MessageCircle} onClick={openWhatsApp} label="Duvidas Rápidas" />
              <ContactIconBtn icon={Icons.Mail} onClick={() => window.open(`mailto:${data.email}`)} label="Propostas e Docs" />
            </div>

            <VideoPlayer url={data.videoUrl} />

            <motion.button whileHover={{ scale: 1.05 }} onClick={openWhatsApp} className="w-full bg-gradient-to-r from-ds-gold to-[#D4AF37] text-ds-green p-4 rounded-xl relative flex items-center justify-center gap-2 shadow-[0_0_30px_rgba(197,160,89,0.6)] animate-pulse-gold group overflow-hidden border border-white/20">
              <Icons.MessageCircle className="animate-pulse" size={24} />
              <div className="flex flex-col items-center leading-tight text-center"><span className="font-bold tracking-wide uppercase text-sm mb-0.5">Falar com Assistente!</span><span className="text-[10px] font-medium opacity-90 normal-case tracking-wide">Experiência digital personalizada 24h por dia</span></div>
            </motion.button>

            <div className="pt-2 pb-6">
              <SmartLinkItem icon={Icons.Home} label="Quanto vale o meu Imóvel?" subLabel="Valor de Mercado" onClick={() => window.open(normalizeUrl(data.website))} />
              <SmartLinkItem icon={Icons.Search} label="Encontrar o Imóvel Ideal!" subLabel="Comprar" onClick={() => window.open(normalizeUrl(data.propertiesUrl))} />
              <SmartLinkItem icon={Icons.Percent} label="Poupar no Crédito e Seguros" subLabel="Simulação Gratuita" onClick={() => window.open(normalizeUrl(data.website))} />
              <SmartLinkItem icon={Icons.Users} label="Trabalhar na minha Equipa" subLabel="Recrutamento" onClick={() => window.open(normalizeUrl(data.website))} />
              <div className="flex gap-2">
                <SmartLinkItem icon={Icons.Briefcase} label="Decisões e Soluções 360º" onClick={() => { playSound('open'); setShowServices(true); }} center={true} />
                <SmartLinkItem icon={Icons.Info} label="Sobre Mim" onClick={() => { playSound('open'); setShowAbout(true); }} center={true} />
              </div>

              <motion.button whileHover={{ scale: 1.05 }} onClick={() => window.open(normalizeUrl(data.website))} className="w-full mt-2 bg-gradient-to-r from-ds-green to-ds-dark border border-ds-gold text-white p-4 rounded-xl relative flex items-center justify-center gap-3 shadow-[0_0_20px_rgba(197,160,89,0.3)] group overflow-hidden">
                <div className="absolute inset-0 bg-ds-gold/10 translate-x-[-100%] group-hover:translate-x-[100%] transition-transform duration-1000"></div>
                <div className="p-2 bg-ds-gold rounded-full text-ds-green"><Icons.Globe size={24} /></div>
                <div className="flex flex-col items-center leading-tight">
                  <span className="font-serif font-bold text-lg text-ds-gold uppercase tracking-widest">Portal de Soluções</span>
                  <span className="text-[10px] text-white/60 tracking-wider">Aceda à nossa plataforma exclusiva</span>
                </div>
              </motion.button>
            </div>

            {data.carousel && <Carousel images={data.carousel} />}

            <div className="text-center mt-6 mb-2">
              <p className="text-ds-gold text-xs uppercase tracking-widest font-semibold mb-4">Conheça o meu percurso e visão</p>
              <div className="flex justify-center space-x-4 max-w-sm mx-auto">
                <a href={normalizeUrl(data.social.facebook)} target="_blank" className="flex-1 flex flex-col items-center gap-2 group p-2 hover:bg-white/5 rounded-xl transition-colors">
                  <div className="text-white p-3 bg-white/5 rounded-full border border-white/10 group-hover:bg-ds-gold/20 group-hover:text-ds-gold group-hover:border-ds-gold/50 transition-all"><Icons.Facebook size={24} /></div>
                  <span className="text-[10px] text-center uppercase tracking-wider text-ds-gold font-bold">Facebook</span>
                  <span className="text-[9px] text-center text-white leading-tight min-h-[24px] flex items-center justify-center">Oportunidades</span>
                </a>
                <a href={normalizeUrl(data.social.instagram)} target="_blank" className="flex-1 flex flex-col items-center gap-2 group p-2 hover:bg-white/5 rounded-xl transition-colors">
                  <div className="text-white p-3 bg-white/5 rounded-full border border-white/10 group-hover:bg-ds-gold/20 group-hover:text-ds-gold group-hover:border-ds-gold/50 transition-all"><Icons.Instagram size={24} /></div>
                  <span className="text-[10px] text-center uppercase tracking-wider text-ds-gold font-bold">Instagram</span>
                  <span className="text-[9px] text-center text-white leading-tight min-h-[24px] flex items-center justify-center">Dia a Dia</span>
                </a>
                <a href={normalizeUrl(data.social.linkedin)} target="_blank" className="flex-1 flex flex-col items-center gap-2 group p-2 hover:bg-white/5 rounded-xl transition-colors">
                  <div className="text-white p-3 bg-white/5 rounded-full border border-white/10 group-hover:bg-ds-gold/20 group-hover:text-ds-gold group-hover:border-ds-gold/50 transition-all"><Icons.Linkedin size={24} /></div>
                  <span className="text-[10px] text-center uppercase tracking-wider text-ds-gold font-bold">LinkedIn</span>
                  <span className="text-[9px] text-center text-white leading-tight min-h-[24px] flex items-center justify-center">Percurso</span>
                </a>
              </div>
            </div>

            <div className="text-center pb-8 pt-2 flex flex-col items-center gap-3">
              <div className="flex justify-center space-x-6 items-center">
                <button onClick={() => setShowPrivacy(true)} className="text-xs text-white hover:text-ds-gold underline decoration-dotted">Políticas de Privacidade</button>
                <div className="text-white/30">|</div>
                <button onClick={() => { playSound('click'); setShowLegal(true); }} className="text-xs text-white hover:text-ds-gold underline decoration-dotted">Aviso Legal</button>
              </div>
              <button onClick={() => { playSound('click'); setShowAdmin(true); }} className="text-[10px] text-white/20 hover:text-ds-gold transition-colors uppercase tracking-widest mt-2">Área Reservada</button>
              <p className="text-[10px] text-white/20 mt-2 font-light">Powered by Jsoc360</p>
            </div>
          </main>

          <div className="fixed bottom-0 left-0 right-0 z-50 px-4 pb-[calc(1rem+env(safe-area-inset-bottom,0px))] pointer-events-none">
            <div className="max-w-md mx-auto bg-gradient-to-r from-[#003B2B]/95 to-[#002A24]/95 backdrop-blur-xl rounded-full border border-ds-gold/30 p-1.5 flex justify-between items-center shadow-[0_5px_20px_rgba(0,0,0,0.6)] pointer-events-auto">
              <button type="button" onClick={() => { playSound('click'); setShowQR(true); }} className="flex-1 flex flex-col items-center py-1.5 text-white/60 hover:text-ds-gold transition-colors group cursor-pointer">
                <Icons.QrCode size={18} className="mb-0.5 group-hover:scale-110 transition-transform" />
                <span className="text-[8px] uppercase tracking-widest font-medium">QR Code</span>
              </button>
              <div className="w-[1px] h-6 bg-white/10"></div>
              <button type="button" onClick={() => { playSound('success'); generateVCard(); }} className="flex-1 flex flex-col items-center py-1.5 text-ds-gold font-bold transition-colors group hover:bg-white/5 rounded-xl cursor-pointer">
                <Icons.UserPlus size={20} className="mb-0.5 text-ds-gold group-hover:scale-110 transition-transform" />
                <span className="text-[8px] uppercase tracking-widest font-bold">Guardar</span>
              </button>
              <div className="w-[1px] h-6 bg-white/10"></div>
              <button type="button" onClick={() => { playSound('click'); shareContact(); }} className="flex-1 flex flex-col items-center py-1.5 text-white/60 hover:text-ds-gold transition-colors group cursor-pointer">
                <Icons.Share2 size={18} className="mb-0.5 group-hover:scale-110 transition-transform" />
                <span className="text-[8px] uppercase tracking-widest font-medium">Partilhar</span>
              </button>
            </div>
          </div>

          {showServices && <ServicesModal data={data} onClose={() => setShowServices(false)} />}
          {showAbout && <AboutModal data={data} onClose={() => setShowAbout(false)} onGenerateVCard={generateVCard} />}
          {showPrivacy && <TextModal title="Política de Privacidade" text={data.privacyText} onClose={() => setShowPrivacy(false)} />}
          {showLegal && <TextModal title="Aviso Legal" text={data.legalText} onClose={() => setShowLegal(false)} />}
          {showQR && (
            <div className="fixed inset-0 z-[60] flex items-center justify-center px-4 bg-black/80 backdrop-blur-sm" onClick={() => setShowQR(false)}>
              <div className="bg-white rounded-2xl p-8 max-w-sm w-full text-center relative" onClick={e => e.stopPropagation()}>
                <button onClick={() => setShowQR(false)} className="absolute top-4 right-4 text-gray-400"><Icons.X size={24} /></button>
                <h3 className="text-ds-green font-serif text-2xl font-bold mb-2">Scan Me</h3>
                <div className="bg-white p-2 rounded-xl border-2 border-ds-gold/20 inline-block mb-6 shadow-inner">
                  <img src={`https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${encodeURIComponent(window.location.href)}`} alt="QR Code" className="w-[200px] h-[200px]" />
                </div>
              </div>
            </div>
          )}
          {showAdmin && <AdminModal data={data} onSave={(d) => { setData(d); localStorage.setItem('cardConfig', JSON.stringify(d)); setShowAdmin(false); alert('Atualizado!'); }} onClose={() => setShowAdmin(false)} />}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>

</html>
